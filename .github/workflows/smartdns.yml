name: SmartDNS sidecar build and isolation

on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/dnsservice/smartdns/**'
      - 'third_party/smartdns/**'
      - '.github/workflows/smartdns.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build SmartDNS ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            ar: ar
            machine: Advanced Micro Devices X86-64
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
            machine: AArch64
    steps:
      - name: Checkout HydraRoute Core
        uses: actions/checkout@v4

      - name: Install native build dependencies
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git libssl-dev file

      - name: Install ARM64 cross-build dependencies
        if: matrix.arch == 'arm64'
        run: |
          # The runner's default archive/security mirrors are native-architecture only.
          # Keep them amd64-only and resolve ARM64 packages from Ubuntu Ports.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d; /^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          elif [ -f /etc/apt/sources.list ]; then
            sudo sed -i -E '/^deb /{ /\\[arch=/! s/^deb /deb [arch=amd64] /; }' /etc/apt/sources.list
          else
            echo 'Could not locate the Ubuntu APT source list to scope native repositories' >&2
            exit 1
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            libssl-dev:arm64

      - name: Fetch pinned SmartDNS source and apply Core isolation patch
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/pymumu/smartdns.git "$RUNNER_TEMP/smartdns"
          git -C "$RUNNER_TEMP/smartdns" fetch --depth=1 origin 21c940edc65520849ba03544c5cf8d9cf326e680
          git -C "$RUNNER_TEMP/smartdns" checkout --detach 21c940edc65520849ba03544c5cf8d9cf326e680
          test "$(git -C "$RUNNER_TEMP/smartdns" rev-parse HEAD)" = "21c940edc65520849ba03544c5cf8d9cf326e680"
          git -C "$RUNNER_TEMP/smartdns" apply --check "$GITHUB_WORKSPACE/third_party/smartdns/patches/0001-disable-netlink-without-mac.patch"
          git -C "$RUNNER_TEMP/smartdns" apply "$GITHUB_WORKSPACE/third_party/smartdns/patches/0001-disable-netlink-without-mac.patch"

      - name: Build pinned SmartDNS without UI or zlib
        env:
          SMARTDNS_CC: ${{ matrix.cc }}
          SMARTDNS_AR: ${{ matrix.ar }}
          SMARTDNS_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-bin"
          printf '#!/bin/sh\necho 2\n' > "$RUNNER_TEMP/build-bin/nproc"
          chmod +x "$RUNNER_TEMP/build-bin/nproc"
          cd "$RUNNER_TEMP/smartdns"
          EXTRA_LDFLAGS=""
          if [ "$SMARTDNS_ARCH" = arm64 ]; then
            EXTRA_LDFLAGS="-L/usr/lib/aarch64-linux-gnu"
          fi
          PATH="$RUNNER_TEMP/build-bin:$PATH" make -C src -j2 \
            CC="$SMARTDNS_CC" AR="$SMARTDNS_AR" \
            WITH_ZLIB=0 VER=48.4 EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH"
          install -m 0755 src/smartdns "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/smartdns"
          file "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/smartdns"
          readelf -h "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/smartdns" | grep 'Machine:'
          readelf -h "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/smartdns" | grep -F "$([ "$SMARTDNS_ARCH" = arm64 ] && echo AArch64 || echo 'Advanced Micro Devices X86-64')"
          sha256sum "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/smartdns" | tee "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/SHA256SUMS"
          printf 'source_commit=21c940edc65520849ba03544c5cf8d9cf326e680\npatch=0001-disable-netlink-without-mac.patch\narch=%s\nwith_zlib=0\nwith_ui=0\n' "$SMARTDNS_ARCH" > "$GITHUB_WORKSPACE/artifacts/smartdns-$SMARTDNS_ARCH/BUILD-MANIFEST.txt"

      - name: Upload SmartDNS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-${{ matrix.arch }}-release48.4
          path: artifacts/smartdns-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  sandbox:
    name: Verify AMD64 config parsing and no host netlink/resolver access
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout HydraRoute Core
        uses: actions/checkout@v4

      - name: Download AMD64 SmartDNS artifact
        uses: actions/download-artifact@v4
        with:
          name: smartdns-amd64-release48.4
          path: ${{ runner.temp }}/smartdns

      - name: Install runtime test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils strace
          chmod +x "$RUNNER_TEMP/smartdns/smartdns"

      - name: Start isolated config and assert no netlink or system resolver access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smartdns-data"
          printf 'ads.example.test\n' > "$RUNNER_TEMP/smartdns-data/ads.txt"
          cat > "$RUNNER_TEMP/smartdns.conf" <<EOFCONF
          bind 127.0.0.1:16053
          bind-tcp 127.0.0.1:16053
          cache-size 4096
          cache-persist no
          resolv-file /dev/null
          local-ptr-enable no
          mdns-lookup no
          expand-ptr-from-address no
          audit-enable no
          log-level error
          ca-path /etc/ssl/certs
          proxy-server socks5://127.0.0.1:16081 -name hr_proxy_test
          server-https https://dns.example.test:443/dns-query -group hr_dns_test -exclude-default-group -proxy hr_proxy_test -host-name dns.example.test -tls-host-verify dns.example.test -host-ip 127.0.0.1 -http-host dns.example.test
          domain-set -name hr_set_ads -type list -file $RUNNER_TEMP/smartdns-data/ads.txt
          address /domain-set:hr_set_ads/#
          address /allowed.example.test/203.0.113.5
          nameserver /-login.example.test/hr_dns_test
          EOFCONF
          timeout --signal=TERM --kill-after=2s 8s strace -f -e trace=socket,bind,openat,execve -o "$RUNNER_TEMP/smartdns.strace" \
            "$RUNNER_TEMP/smartdns/smartdns" -f -c "$RUNNER_TEMP/smartdns.conf" -p - > "$RUNNER_TEMP/smartdns.log" 2>&1 &
          trace_pid=$!
          cleanup() { kill "$trace_pid" 2>/dev/null || true; wait "$trace_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if dig @127.0.0.1 -p 16053 allowed.example.test A +short +time=1 +tries=1 | grep -qx '203.0.113.5'; then
              break
            fi
            sleep 0.2
          done
          dig @127.0.0.1 -p 16053 allowed.example.test A +short +time=1 +tries=1 | grep -qx '203.0.113.5'
          if grep -Eq 'socket\(AF_NETLINK|socket\(PF_NETLINK' "$RUNNER_TEMP/smartdns.strace"; then
            echo 'SmartDNS opened a NETLINK socket despite Core isolation patch/config' >&2
            cat "$RUNNER_TEMP/smartdns.strace" >&2
            exit 1
          fi
          if grep -F '"/etc/resolv.conf"' "$RUNNER_TEMP/smartdns.strace"; then
            echo 'SmartDNS read the host system resolver file' >&2
            exit 1
          fi
          if grep -E 'execve\(".*/(ip|iptables|ip6tables|nft|ipset)"' "$RUNNER_TEMP/smartdns.strace"; then
            echo 'SmartDNS attempted to invoke a host networking tool' >&2
            exit 1
          fi
          grep -F '127.0.0.1' "$RUNNER_TEMP/smartdns.strace" | grep -F '16053'
          cat "$RUNNER_TEMP/smartdns.log"
