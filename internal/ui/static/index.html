<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11101d">
<title>HydraRoute Core</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<script defer src="/app.js"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="#" data-page="hydra">
      <span class="brand-mark">H</span>
      <span><strong>HYDRAROUTE</strong><small>CORE CONTROL</small></span>
    </a>
    <div class="top-actions">
      <div class="system-meters" id="systemMeters" aria-label="Загрузка процессора и оперативной памяти">
        <div class="system-meter"><span>ЦП</span><div class="system-meter-track" id="cpuMeterTrack" aria-hidden="true"></div><strong id="cpuMeterValue">—</strong></div>
        <div class="system-meter"><span>ОЗУ</span><div class="system-meter-track" id="ramMeterTrack" aria-hidden="true"></div><strong id="ramMeterValue">—</strong></div>
      </div>
      <span class="connection-pill"><i></i><span id="connectionText">Проверка API</span></span>
      <button class="icon-button" id="themeToggle" aria-label="Переключить тему" title="Сменить тему">☼</button>
      <button class="icon-button mobile-menu" id="menuToggle" aria-label="Открыть меню">☰</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-caption">УПРАВЛЕНИЕ</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="rules"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Правила</button>
        <button class="nav-item" data-page="network"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.8 10.6 6.4-4.2M8.8 13.4l6.4 4.2"/></svg></span>Подключения</button>
        <button class="nav-item" data-page="dns"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-4 6-4 9s1 6 4 9M12 3c3 3 4 6 4 9s-1 6-4 9"/></svg></span>DNS</button>
        <button class="nav-item" data-page="hydra"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.5" fill="var(--surface)"/><circle cx="16" cy="12" r="2.5" fill="var(--surface)"/><circle cx="9" cy="18" r="2.5" fill="var(--surface)"/></svg></span>Hydra</button>
        <button class="nav-item" data-page="info"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span>Инфо</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4l.7 2.5 2 .9 2.3-1.2 2.8 2.8-1.2 2.3.9 2L24 12l-2.5.7-.9 2 1.2 2.3-2.8 2.8-2.3-1.2-2 .9L14 22h-4l-.7-2.5-2-.9-2.3 1.2-2.8-2.8 1.2-2.3-.9-2L0 12l2.5-.7.9-2-1.2-2.3L5 4.2l2.3 1.2 2-.9z" transform="translate(2 2) scale(.8333)"/><circle cx="12" cy="12" r="3"/></svg></span>Настройки</button>
        <button class="nav-item" id="logoutButton" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 7l5 5-5 5M8 12h11"/></svg></span>Выход</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-status"><span class="status-dot" id="runtimeDot"></span><div><b id="runtimeLabel">Runtime неизвестен</b><small id="runtimeSub">Ожидание статуса</small></div></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-heading">
        <div><h1 id="pageTitle">Правила</h1><p id="pageDescription">Порядок обработки трафика · первое совпадение сверху вниз</p></div>
        <button class="button secondary" id="refreshButton">↻ Обновить</button>
      </div>
      <section id="pageContent" aria-live="polite">
        <div class="loading-card">Загрузка состояния HydraRoute Core…</div>
      </section>

    </main>
  </div>
      <footer class="footer core-footer" aria-label="Информация о HydraRoute Core">
        <div class="core-footer-version"><strong>HydraRoute Core</strong><small>Версия: Pre-release · ARM64</small></div>
        <div class="core-footer-links">
          <a class="core-footer-link" href="https://github.com/Xenofan-git/HydraRoute-Core" target="_blank" rel="noopener noreferrer" aria-label="Репозиторий HydraRoute Core на GitHub"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 .1 1.7-.77 1.7-.77.1-.73.4-1.23.72-1.51-2.5-.29-5.13-1.25-5.13-5.57 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15A10.8 10.8 0 0 1 12 5.52c.96 0 1.93.13 2.83.38 2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.69.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.33-2.64 5.28-5.15 5.56.4.35.76 1.04.76 2.1v3.77c0 .3.2.65.77.54A11.3 11.3 0 0 0 12 .7Z"/></svg> GitHub</a>
          <button type="button" class="core-footer-link core-footer-donate" disabled title="Ссылка на поддержку появится позже" aria-label="Donate — скоро"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h14v5a7 7 0 0 1-7 7h0a7 7 0 0 1-7-7V9Z"/><path d="M18 10h2a2 2 0 0 1 0 4h-2M2 22h19M8 3c-2 2 2 3 0 5M13 2c-2 2 2 3 0 5"/></svg> Donate</button>
        </div>
      </footer>
  <div class="toast" id="toast" role="status"></div>
</div>
</body>
</html>
